<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerba Soberanía - Automatización e IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { background: #0b1120; border-right: 1px solid #1e293b; }
        .accent-emerald { color: #10b981; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #10b981; cursor: pointer; }
        .sending-row { background-color: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        #tutorialModal { display: flex; background: transparent; pointer-events: none; justify-content: center; align-items: flex-end; }
        @media (min-width: 768px) { #tutorialModal { justify-content: flex-end; } }
        .tutorial-card { pointer-events: auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(16, 185, 129, 0.5); transform: translateY(20px); opacity: 0; transition: all 0.4s ease; margin: 1rem; width: calc(100% - 2rem); max-width: 350px; }
        .tutorial-active .tutorial-card { transform: translateY(0); opacity: 1; }
        .highlight-element { position: relative; z-index: 110 !important; box-shadow: 0 0 0 9999px rgba(2, 6, 23, 0.6); border-radius: 1rem; outline: 3px solid #10b981; outline-offset: 4px; }
        .app-container { height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .app-password-guide { display: none; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin-top: 8px; font-size: 11px; color: #94a3b8; }
        .ai-loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 font-sans overflow-hidden">

    <div class="app-container flex flex-col lg:flex-row">
        <aside class="lg:w-96 sidebar p-6 space-y-6 flex flex-col shrink-0 lg:h-screen overflow-y-auto custom-scroll">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-600 p-2 rounded-xl"><i class="fa-solid fa-leaf text-white text-xl"></i></div>
                <h1 class="text-lg font-black tracking-tighter uppercase italic leading-none">Yerba <span class="accent-emerald">Soberanía</span></h1>
            </div>

            <div id="step-1" class="space-y-4 pt-4 rounded-2xl transition-all duration-300">
                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">1. Localización</h3>
                <div class="flex gap-2">
                    <input type="text" id="zona" placeholder="Ej: Morón, Buenos Aires" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-2xl text-sm outline-none focus:border-emerald-500 transition">
                    <button onclick="buscar()" id="btnBuscar" class="bg-emerald-600 px-5 rounded-2xl hover:bg-emerald-500 transition"><i class="fa-solid fa-search"></i></button>
                </div>
            </div>

            <div id="step-2" class="space-y-4 pt-4 rounded-2xl transition-all duration-300">
                <h3 class="text-[10px] font-black text-emerald-500 uppercase tracking-widest border-b border-emerald-900/30 pb-2">2. WhatsApp</h3>
                <div class="space-y-3">
                    <select id="waVersion" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs outline-none focus:border-emerald-500"><option value="web">WhatsApp Web</option><option value="app">App Messenger / Business</option></select>
                    <textarea id="waBody" rows="3" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-[10px] outline-none focus:border-emerald-500 resize-none transition-all">Hola {nombre}, ¿cómo estás? Te escribo de Yerba Mate Soberanía para enviarte nuestra lista de precios mayorista.</textarea>
                    <button onclick="iniciarWhatsAppMasivo()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl hover:bg-emerald-500 transition flex items-center justify-center gap-2 text-xs uppercase shadow-lg"><i class="fa-brands fa-whatsapp text-lg"></i> Iniciar Envío WA</button>
                </div>
            </div>

            <div id="step-email" class="space-y-4 pt-4 pb-10">
                <h3 class="text-[10px] font-black text-blue-500 uppercase tracking-widest border-b border-blue-900/30 pb-2">3. Gmail Masivo</h3>
                <div class="space-y-3">
                    <input type="email" id="emailUser" placeholder="Tu Gmail" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-[10px] outline-none">
                    <div class="space-y-1">
                        <div class="flex justify-between items-center px-1">
                            <label class="text-[9px] font-bold text-slate-500 uppercase">Clave de Seguridad</label>
                            <button onclick="toggleGuiaEmail()" class="text-blue-500 text-[9px] font-bold hover:underline italic">Ayuda</button>
                        </div>
                        <input type="password" id="emailPass" placeholder="Clave de 16 letras" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-[10px] outline-none focus:border-blue-500">
                        <div id="guiaEmail" class="app-password-guide">
                            <p class="font-bold text-blue-400">Pasos:</p>
                            <ol class="list-decimal list-inside space-y-1 leading-relaxed text-[10px]">
                                <li>Entra a: <a href="https://myaccount.google.com/apppasswords" target="_blank" class="text-emerald-400 underline font-bold">Panel de Google</a></li>
                                <li>Crea una clave llamada <span class="text-white font-bold">CRM</span>.</li>
                                <li>Copia el código de 16 letras.</li>
                            </ol>
                        </div>
                    </div>
                    <textarea id="emailBody" rows="8" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-[10px] outline-none focus:border-blue-500 resize-none transition-all">Hola, buen día:

Mi nombre es Juan Ignacio Lewczuk y me comunico para ofrecerles Yerba Mate Soberanía para venta por mayor en dietéticas y comercios naturales.

Ofrecemos:
- Precios mayoristas competitivos
- Abastecimiento constante
- Formatos ideales para dietéticas

📱 WhatsApp: 11 3134-4552</textarea>
                    <button onclick="iniciarEmailMasivo()" id="btnEmailMasivo" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl hover:bg-blue-500 transition flex items-center justify-center gap-2 text-xs uppercase shadow-lg"><i class="fa-solid fa-envelope"></i> Enviar Emails</button>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-4 lg:p-8 flex flex-col overflow-visible">
            <div class="bg-[#0b1120] rounded-[2rem] border border-slate-800 shadow-2xl flex flex-col flex-1 min-h-[500px]">
                <div class="px-8 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/40 sticky top-0 z-10 rounded-t-[2rem]">
                    <div id="step-3" class="flex items-center gap-4 rounded-xl p-1 transition-all duration-300">
                        <input type="checkbox" id="selectAll" onclick="toggleAll()">
                        <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Resultados</h2>
                    </div>
                    <div id="stats" class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Listo</div>
                </div>
                <div class="overflow-x-auto overflow-y-visible">
                    <table class="w-full text-[11px] text-left min-w-[700px]">
                        <thead class="bg-slate-900/80 text-[9px] uppercase text-slate-500 font-black sticky top-0">
                            <tr><th class="px-6 py-4 w-10 text-center">Sel</th><th>Comercio</th><th class="text-center">WhatsApp</th><th>Email</th><th class="text-center">Estado</th></tr>
                        </thead>
                        <tbody id="leadsTable" class="divide-y divide-slate-800/50"><tr><td colspan="5" class="py-20 text-center text-slate-700 italic">Busca una zona...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- TUTORIAL -->
    <div id="tutorialModal" class="modal" style="display: none;">
        <div class="tutorial-card p-6 rounded-[1.5rem] space-y-4">
            <h2 class="text-sm font-black text-white uppercase tracking-tighter">Guía Rápida</h2>
            <p class="text-[11px] text-slate-300" id="tutorialText">Bienvenido al sistema.</p>
            <div class="flex items-center justify-between gap-4 pt-2">
                <button onclick="cerrarTutorialPermanente()" class="text-slate-500 text-[9px] uppercase font-bold">Omitir</button>
                <button onclick="nextTutorialStep()" id="btnTutorial" class="bg-emerald-600 text-white font-black px-4 py-2 rounded-lg text-[10px] uppercase shadow-lg">Siguiente</button>
            </div>
        </div>
    </div>

    <script>
        let leads = []; let waCola = []; let waCursor = 0; let tutorialStep = 0;
        let revelandoEmails = false;

        const tutorialSteps = [
            { title: "¡Hola!", text: "Esta herramienta busca dietéticas automáticamente.", highlight: null },
            { title: "1. Búsqueda", text: "Escribe una ciudad y busca.", highlight: "step-1" },
            { title: "2. Revelación IA ✨", text: "La IA buscará emails automáticamente después de la búsqueda.", highlight: "step-2" },
            { title: "3. Email", text: "Configura tu Gmail y envía.", highlight: "step-email" }
        ];

        window.onload = () => { if (!sessionStorage.getItem('tutorialVisto')) { document.getElementById('tutorialModal').style.display = 'flex'; document.getElementById('tutorialModal').classList.add('tutorial-active'); } };

        async function callGemini(prompt, systemInstruction) {
            try {
                const res = await fetch('/api/ai_query', { 
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ prompt, systemInstruction }) 
                });
                const data = await res.json();
                if (res.status === 429) return { error: 'LIMIT', wait: data.retry_after || 10 };
                if (!res.ok) return null;
                return { text: data.text };
            } catch (e) { return null; }
        }

        async function autoRevelarEmails() {
            if (revelandoEmails) return;
            revelandoEmails = true;
            for (let i = 0; i < leads.length; i++) {
                if (!leads[i].email) {
                    const el = document.getElementById(`email-text-${i}`);
                    if (el) el.innerHTML = '<span class="animate-pulse text-blue-500">✨ Revelando...</span>';
                    
                    const res = await callGemini(`Negocio: ${leads[i].nombre} en ${leads[i].direccion}. Dame SOLO el email de contacto corporativo más probable. Si no sabes, responde "No encontrado".`, "Experto en contactos.");
                    
                    if (res && res.error === 'LIMIT') {
                        if (el) el.innerHTML = `<span class="text-[8px] text-yellow-500 italic">Esperando cupo IA (${res.wait}s)...</span>`;
                        await new Promise(r => setTimeout(r, res.wait * 1000));
                        i--; continue; // Reintentar este mismo
                    }
                    
                    if (res && res.text && res.text.toLowerCase().includes('@')) {
                        leads[i].email = res.text.trim().toLowerCase();
                    } else {
                        leads[i].email = '-';
                    }
                    renderTable();
                    await new Promise(r => setTimeout(r, 1500)); // Pausa para no agotar cuota
                }
            }
            revelandoEmails = false;
        }

        async function buscar() {
            const zona = document.getElementById('zona').value;
            if(!zona) return;
            document.getElementById('btnBuscar').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const res = await fetch('/search_places', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({zona}) });
                const data = await res.json();
                leads = data.leads || []; renderTable();
                document.getElementById('stats').innerText = `${leads.length} RESULTADOS`;
                autoRevelarEmails();
            } catch(e) { alert("Error de servidor. Intenta con una zona más pequeña."); } 
            finally { document.getElementById('btnBuscar').innerHTML = '<i class="fa-solid fa-search"></i>'; }
        }

        function renderTable() {
            const tbody = document.getElementById('leadsTable');
            tbody.innerHTML = "";
            leads.forEach((l, i) => {
                const tr = document.createElement('tr');
                tr.id = `row-${i}`;
                tr.className = "hover:bg-slate-900/40 transition group";
                const canCheck = (l.email && l.email !== '-') || l.telefono;
                tr.innerHTML = `
                    <td class="px-6 py-4 text-center"><input type="checkbox" class="lead-check" data-index="${i}" ${canCheck ? 'checked' : ''}></td>
                    <td class="px-6 py-4 font-bold text-slate-200">${l.nombre}</td>
                    <td class="px-6 py-4 text-center"><button onclick="abrirChat(${i})" class="text-emerald-500 font-mono hover:underline w-full"><i class="fa-brands fa-whatsapp"></i> ${l.telefono || '--'}</button></td>
                    <td class="px-6 py-4"><span id="email-text-${i}" class="${l.email && l.email !== '-' ? 'text-blue-300 font-bold' : ''}">${l.email || '---'}</span></td>
                    <td class="px-6 py-4 text-center" id="status-${i}"><span class="text-[9px] text-slate-700 uppercase font-black">Pendiente</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function iniciarEmailMasivo() { 
            const user = document.getElementById('emailUser').value;
            const pass = document.getElementById('emailPass').value;
            if(!user || !pass) return alert("Configura Gmail y Clave.");
            const selected = []; 
            document.querySelectorAll('.lead-check:checked').forEach(c => { 
                const idx = parseInt(c.dataset.index); 
                if(leads[idx].email && leads[idx].email !== '-') selected.push({...leads[idx], original_index: idx}); 
            }); 
            if(selected.length === 0) return alert("Selecciona tiendas con email."); 
            
            const btn = document.getElementById('btnEmailMasivo');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';

            const response = await fetch('/start_email_campaign', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ leads: selected, email_user: user, email_pass: pass, subject: "Yerba Mate Soberanía - Oferta Mayorista", body: document.getElementById('emailBody').value, attach_image: true })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                decoder.decode(value).split('\n').forEach(line => {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.replace('data: ', ''));
                            if (data.status === 'finished') { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-envelope"></i> Enviar Emails'; alert("Fin de campaña."); }
                            else if (data.index !== undefined) {
                                document.getElementById(`status-${data.index}`).innerHTML = `<span class="text-[9px] ${data.success ? 'text-green-500' : 'text-red-500'} font-black uppercase">${data.msg}</span>`;
                            }
                        } catch(e) {}
                    }
                });
            }
        }

        function toggleAll() { const m = document.getElementById('selectAll'); document.querySelectorAll('.lead-check').forEach(c => c.checked = m.checked); }
        function abrirChat(idx) { const l = leads[idx]; if(!l.telefono) return; const url = `https://web.whatsapp.com/send?phone=${l.telefono}&text=${encodeURIComponent(document.getElementById('waBody').value.replace('{nombre}', l.nombre))}`; window.open(url, "wa_session"); document.getElementById(`status-${idx}`).innerHTML = `<span class="text-emerald-500 font-black uppercase">Abierto</span>`; }
        function iniciarWhatsAppMasivo() { waCola = []; document.querySelectorAll('.lead-check:checked').forEach(c => waCola.push(parseInt(c.dataset.index))); if(waCola.length === 0) return alert("Selecciona tiendas."); waCursor = 0; document.getElementById('waModal').style.display = 'flex'; actualizarModalWA(); }
        function actualizarModalWA() { if(waCursor >= waCola.length) { document.getElementById('modalTitle').innerText = "¡Fin!"; document.getElementById('btnSiguiente').style.display = 'none'; return; } const current = leads[waCola[waCursor]]; document.getElementById('modalTitle').innerText = current.nombre; document.getElementById('modalProgress').innerText = `${waCursor + 1} de ${waCola.length}`; document.querySelectorAll('tr').forEach(r => r.classList.remove('sending-row')); document.getElementById(`row-${waCola[waCursor]}`).classList.add('sending-row'); }
        function abrirSiguienteWA() { abrirChat(waCola[waCursor]); waCursor++; actualizarModalWA(); }
        function cerrarModal() { document.getElementById('waModal').style.display = 'none'; }
        function toggleGuiaEmail() { const guia = document.getElementById('guiaEmail'); guia.style.display = (guia.style.display === 'block') ? 'none' : 'block'; }
        function cerrarTutorialPermanente() { document.getElementById('tutorialModal').style.display = 'none'; sessionStorage.setItem('tutorialVisto', 'true'); }
        function nextTutorialStep() { if (tutorialSteps[tutorialStep].highlight) document.getElementById(tutorialSteps[tutorialStep].highlight).classList.remove('highlight-element'); tutorialStep++; if (tutorialStep >= tutorialSteps.length) return cerrarTutorialPermanente(); const step = tutorialSteps[tutorialStep]; document.getElementById('tutorialText').innerText = step.text; if (step.highlight) { const el = document.getElementById(step.highlight); el.classList.add('highlight-element'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
    </script>
</body>
</html>
