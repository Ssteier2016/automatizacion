<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YerbaPromo B2B - Automatización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .brand-gradient { background: linear-gradient(135deg, #064e3b 0%, #059669 100%); }
        .log-box::-webkit-scrollbar { width: 4px; }
        .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <nav class="brand-gradient text-white py-4 shadow-lg">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-leaf text-2xl"></i>
                <h1 class="font-black text-xl tracking-tighter uppercase">YerbaPromo B2B</h1>
            </div>
            <div class="text-[10px] bg-white/20 px-3 py-1 rounded-full border border-white/20 font-bold uppercase tracking-widest">
                v3.0 Automática
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Columna Lateral -->
            <aside class="lg:col-span-4 space-y-6">
                
                <!-- PASO 1: BÚSQUEDA -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                        <i class="fa-solid fa-1 mr-2 text-emerald-600"></i> Extraer Leads
                    </h3>
                    <div class="space-y-3">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase">Zona de búsqueda</label>
                        <div class="flex gap-2">
                            <input type="text" id="zonaBusqueda" placeholder="Ej: Morón, Buenos Aires" 
                                class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                            <button onclick="buscarEnMaps()" id="btnBuscar" 
                                class="bg-emerald-600 text-white px-5 rounded-2xl hover:bg-emerald-700 transition">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 italic">Al buscar, se descargará un CSV a tu Mac automáticamente.</p>
                    </div>
                </div>

                <!-- PASO 2: CREDENCIALES -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                        <i class="fa-solid fa-2 mr-2 text-emerald-600"></i> Configurar Email
                    </h3>
                    <div class="space-y-4">
                        <input type="email" id="email_user" placeholder="Tu Gmail" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                        <input type="password" id="email_pass" placeholder="App Password (16 dígitos)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <!-- PASO 3: SUBIDA -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                        <i class="fa-solid fa-3 mr-2 text-emerald-600"></i> Subir Lista Final
                    </h3>
                    <div class="relative border-2 border-dashed border-slate-200 rounded-3xl p-6 text-center hover:border-emerald-500 transition cursor-pointer group">
                        <input type="file" id="csvFile" accept=".csv, .xlsx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <i class="fa-solid fa-file-csv text-3xl text-slate-300 group-hover:text-emerald-500 mb-2"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Sube el archivo editado</p>
                    </div>
                    <div id="fileInfo" class="hidden mt-4 bg-emerald-600 text-white p-4 rounded-2xl flex items-center justify-between">
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold truncate" id="fileName">archivo.csv</p>
                            <p class="text-[10px] opacity-70" id="rowCount">0 filas</p>
                        </div>
                        <i class="fa-solid fa-check-circle"></i>
                        <input type="hidden" id="serverFilePath">
                    </div>
                </div>
            </aside>

            <!-- Columna de Campaña -->
            <section class="lg:col-span-8 space-y-6">
                
                <!-- REDACCIÓN -->
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-6 italic">Mensaje de Campaña</h2>
                    <div class="space-y-4">
                        <input type="text" id="subject" value="Propuesta estratégica para {nombre}" 
                            class="w-full text-lg font-bold py-2 border-b-2 border-slate-100 focus:border-emerald-500 outline-none transition">
                        
                        <div class="relative">
                            <textarea id="body" rows="10" 
                                class="w-full p-6 bg-slate-50 rounded-3xl border-none focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700 resize-none"
                                placeholder="Hola {nombre}, te escribo por..."></textarea>
                        </div>

                        <div class="flex justify-between items-center pt-4">
                            <p class="text-xs text-slate-400">Protección anti-spam activa (pausas aleatorias).</p>
                            <button onclick="startCampaign()" id="sendBtn" 
                                class="bg-slate-900 text-white px-10 py-4 rounded-2xl hover:bg-black transition-all shadow-xl font-bold flex items-center gap-3">
                                <i class="fa-solid fa-paper-plane"></i> Lanzar Campaña
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TERMINAL LOGS -->
                <div id="consoleArea" class="hidden bg-slate-950 rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
                    <div class="bg-slate-900/50 px-6 py-3 flex justify-between items-center border-b border-white/5">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Live Monitor</span>
                        <span id="progressText" class="text-emerald-400 font-mono font-bold text-sm">0%</span>
                    </div>
                    <div class="bg-slate-800 h-1">
                        <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <div id="logs" class="p-6 h-72 overflow-y-auto text-slate-400 font-mono text-[11px] log-box">
                        <!-- Logs dinámicos -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        async function buscarEnMaps() {
            const zona = document.getElementById('zonaBusqueda').value;
            const btn = document.getElementById('btnBuscar');
            if(!zona) return alert("Ingresa una zona.");
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const res = await fetch('/search_places', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({zona: zona})
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error);

                // ACCIÓN CLAVE: Falla la redirección al endpoint de descarga
                window.location.href = '/download/' + data.filename;
                
                document.getElementById('fileInfo').classList.remove('hidden');
                document.getElementById('fileName').textContent = data.filename;
                document.getElementById('rowCount').textContent = `${data.total_rows} registros`;
                document.getElementById('serverFilePath').value = data.filepath;
                
                alert("¡Búsqueda lista! Revisa tu carpeta de Descargas.");
            } catch(e) { alert("Error: " + e.message); }
            finally { 
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>';
            }
        }

        document.getElementById('csvFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/preview_csv', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.error) throw new Error(data.error);
                document.getElementById('fileInfo').classList.remove('hidden');
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('serverFilePath').value = data.filepath;
            } catch(e) { alert(e.message); }
        });

        async function startCampaign() {
            const filePath = document.getElementById('serverFilePath').value;
            const emailUser = document.getElementById('email_user').value;
            const emailPass = document.getElementById('email_pass').value;
            if(!filePath || !emailUser || !emailPass) return alert("Completa todos los pasos.");

            const sendBtn = document.getElementById('sendBtn');
            const logsDiv = document.getElementById('logs');
            const progressBar = document.getElementById('progressBar');

            document.getElementById('consoleArea').classList.remove('hidden');
            sendBtn.disabled = true;
            logsDiv.innerHTML = '<div class="text-white">> Iniciando secuencia...</div>';

            const formData = new FormData();
            formData.append('filepath', filePath);
            formData.append('email_user', emailUser);
            formData.append('email_pass', emailPass);
            formData.append('subject', document.getElementById('subject').value);
            formData.append('body', document.getElementById('body').value);

            try {
                const response = await fetch('/start_campaign', { method: 'POST', body: formData });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let totalEmails = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const cleanJson = line.replace('data: ', '').replace(/'/g, '"');
                        const data = JSON.parse(cleanJson);
                        if(data.status === 'start') totalEmails = data.total;
                        if(data.progress) {
                            const pct = Math.round((data.progress / totalEmails) * 100);
                            progressBar.style.width = `${pct}%`;
                            document.getElementById('progressText').innerText = `${pct}%`;
                            const log = document.createElement('div');
                            log.innerHTML = data.log;
                            logsDiv.prepend(log);
                        }
                        if(data.status === 'finished') {
                            sendBtn.innerHTML = '<i class="fa-solid fa-check"></i> Finalizado';
                            sendBtn.classList.replace('bg-slate-900', 'bg-emerald-600');
                        }
                    }
                }
            } catch(e) { alert("Error de conexión."); }
        }
    </script>
</body>
</html>
